    <script>
      (function() {
        // Fix: 'Cannot set property fetch of #<Window> which has only a getter'
        // Caused by Chrome extensions attempting to monkey-patch window.fetch in environments where it lacks a setter
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoFetch = Window.prototype.fetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return protoFetch;
                },
                set: function(fn) {
                  protoFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }

        // Catch and prevent chrome-extension scripts from breaking runtime or reporting unhandled errors
        window.addEventListener('error', function(event) {
          var isExtensionError = event.filename && event.filename.indexOf('chrome-extension://') !== -1;
          var isFetchGetterError = event.message && event.message.indexOf('Cannot set property fetch') !== -1;
          if (isExtensionError || isFetchGetterError) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = event.reason ? (event.reason.message || String(event.reason)) : '';
          if (reasonStr && reasonStr.indexOf('Cannot set property fetch') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
      })();
    </script>
