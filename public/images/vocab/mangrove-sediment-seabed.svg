<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Inter, system-ui, sans-serif">
  <rect width="680" height="320" rx="18" fill="#ecfdf5"/>
  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#064e3b">Mangrove Root Systems: Dampening Waves, Trapping Sediment &amp; Elevating Seabed</text>

  <!-- Sky & Water -->
  <rect x="24" y="48" width="632" height="248" rx="14" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
  <path d="M24 176 L656 176 L656 296 L24 296 Z" fill="#bae6fd"/>

  <!-- Semi-permeable brushwood fence -->
  <rect x="148" y="146" width="10" height="95" fill="#78350f"/>
  <rect x="172" y="146" width="10" height="95" fill="#78350f"/>
  <line x1="145" y1="162" x2="185" y2="162" stroke="#92400e" stroke-width="3"/>
  <line x1="145" y1="182" x2="185" y2="182" stroke="#92400e" stroke-width="3"/>
  <line x1="145" y1="202" x2="185" y2="202" stroke="#92400e" stroke-width="3"/>
  <text x="165" y="135" text-anchor="middle" font-size="10.5" font-weight="700" fill="#78350f">Semi-permeable dam</text>

  <!-- Tidal currents incoming -->
  <path d="M44 195 L128 195" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  <polygon points="134,195 122,188 122,202" fill="#0284c7"/>
  <text x="86" y="216" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0369a1">Tidal currents</text>

  <!-- Mangrove Trees & Tangled Root Systems -->
  <circle cx="430" cy="108" r="38" fill="#16a34a"/>
  <circle cx="468" cy="116" r="32" fill="#15803d"/>
  <circle cx="395" cy="118" r="28" fill="#22c55e"/>
  <rect x="425" y="138" width="12" height="54" fill="#713f12"/>
  <!-- Prop roots -->
  <path d="M428 165 Q395 198 382 242" stroke="#713f12" stroke-width="4" fill="none"/>
  <path d="M431 168 Q412 204 408 245" stroke="#713f12" stroke-width="4" fill="none"/>
  <path d="M434 168 Q452 204 456 244" stroke="#713f12" stroke-width="4" fill="none"/>
  <path d="M436 165 Q474 198 486 240" stroke="#713f12" stroke-width="4" fill="none"/>
  <text x="432" y="64" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">MANGROVES (කඩොලාන)</text>

  <!-- Rising Seabed from Trapped Sediment -->
  <path d="M24 268 L160 264 Q310 232 656 214 L656 296 L24 296 Z" fill="#a16207" opacity="0.8"/>
  <circle cx="355" cy="236" r="3.5" fill="#fef08a"/>
  <circle cx="395" cy="232" r="3.5" fill="#fef08a"/>
  <circle cx="442" cy="228" r="3.5" fill="#fef08a"/>
  <text x="275" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">Dampening wave energy</text>
  <text x="495" y="256" text-anchor="middle" font-size="11.5" font-weight="800" fill="#fffbeb">Root systems TRAP SEDIMENT</text>
  <text x="495" y="275" text-anchor="middle" font-size="11" font-weight="700" fill="#fef3c7">→ Elevates the seabed (මුහුදු පතුල ඉහළට එසවීම)</text>
</svg>
