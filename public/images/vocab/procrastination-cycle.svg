<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="420" rx="20" fill="#fffbeb"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">The Procrastination Cycle &amp; How to Break It</text>
  <text x="400" y="60" text-anchor="middle" font-size="13" fill="#475569">Temporary Mood Repair → Guilt → Reinforces Negative Mood</text>

  <!-- 4 Cycle Nodes -->
  <!-- Top: Task Threatens Self-Worth -->
  <rect x="255" y="84" width="290" height="62" rx="14" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="400" y="110" text-anchor="middle" font-size="13.5" font-weight="800" fill="#991b1b">1. Task Threatens Self-Worth</text>
  <text x="400" y="130" text-anchor="middle" font-size="11.5" fill="#b91c1c">Makes us feel anxious &amp; afraid of failing</text>

  <!-- Right: Put Off Task (Temporary Relief) -->
  <rect x="520" y="192" width="244" height="68" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="642" y="218" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1e3a8a">2. Put Off Task at Hand</text>
  <text x="642" y="238" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Mood repair is ONLY TEMPORARY</text>
  <text x="642" y="252" text-anchor="middle" font-size="10.5" fill="#3b82f6">(Short-term measure)</text>

  <!-- Bottom: Left with Sense of Guilt -->
  <rect x="255" y="306" width="290" height="64" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="332" text-anchor="middle" font-size="13.5" font-weight="800" fill="#92400e">3. Left with a Sense of Guilt</text>
  <text x="400" y="352" text-anchor="middle" font-size="11.5" fill="#b45309">Deadline gets closer · Berating ourselves</text>

  <!-- Left: Reinforces Negative Mood -->
  <rect x="36" y="192" width="244" height="68" rx="14" fill="#fae8ff" stroke="#c084fc" stroke-width="2"/>
  <text x="158" y="218" text-anchor="middle" font-size="13.5" font-weight="800" fill="#581c87">4. Reinforces Tendency</text>
  <text x="158" y="238" text-anchor="middle" font-size="11.5" fill="#7e22ce">Worsens negative mood &amp; leads</text>
  <text x="158" y="252" text-anchor="middle" font-size="10.5" fill="#9333ea">to MORE procrastination!</text>

  <!-- Curved Cycle Arrows -->
  <path d="M552 118 Q638 128 642 184" fill="none" stroke="#64748b" stroke-width="3"/>
  <polygon points="642,190 636,178 648,178" fill="#64748b"/>

  <path d="M642 264 Q635 330 552 338" fill="none" stroke="#64748b" stroke-width="3"/>
  <polygon points="546,338 558,332 558,344" fill="#64748b"/>

  <path d="M250 338 Q165 330 158 266" fill="none" stroke="#64748b" stroke-width="3"/>
  <polygon points="158,260 152,272 164,272" fill="#64748b"/>

  <path d="M158 188 Q165 128 248 118" fill="none" stroke="#64748b" stroke-width="3"/>
  <polygon points="254,118 242,112 242,124" fill="#64748b"/>

  <!-- Center Solution Badge: Break the Cycle -->
  <rect x="304" y="186" width="192" height="80" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <text x="400" y="211" text-anchor="middle" font-size="12.5" font-weight="900" fill="#065f46">✓ BREAK THE CYCLE</text>
  <text x="400" y="229" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">• Self-compassion (Forgive)</text>
  <text x="400" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">• Fend off distractions</text>
</svg>
