<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Inter, system-ui, sans-serif">
  <rect width="680" height="320" rx="18" fill="#f8fafc"/>
  <text x="340" y="32" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Artistic Scale &amp; Perspective: Magnified Botanical, Soaring &amp; Aerial Views</text>

  <!-- 1. Magnified Flower Filling Entire Canvas -->
  <rect x="22" y="50" width="202" height="246" rx="12" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <circle cx="123" cy="162" r="78" fill="#fb7185" opacity="0.3"/>
  <circle cx="95" cy="135" r="46" fill="#f43f5e" opacity="0.55"/>
  <circle cx="152" cy="138" r="46" fill="#e11d48" opacity="0.5"/>
  <circle cx="98" cy="188" r="46" fill="#fb7185" opacity="0.65"/>
  <circle cx="150" cy="188" r="46" fill="#f43f5e" opacity="0.6"/>
  <circle cx="123" cy="162" r="22" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="123" y="74" text-anchor="middle" font-size="12.5" font-weight="800" fill="#9f1239">MAGNIFIED BOTANICAL</text>
  <text x="123" y="266" text-anchor="middle" font-size="10.5" font-weight="600" fill="#881337">Fills an entire canvas (විශාල කළ මල)</text>
  <text x="123" y="282" text-anchor="middle" font-size="10" fill="#9f1239">Brings viewer into the picture</text>

  <!-- 2. Soaring Skyscrapers -->
  <rect x="239" y="50" width="202" height="246" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="340" y="74" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e3a8a">SOARING SKYSCRAPERS</text>
  <polygon points="276,248 292,118 316,118 324,248" fill="#3b82f6"/>
  <polygon points="326,248 340,86 360,86 372,248" fill="#1d4ed8"/>
  <polygon points="374,248 384,134 406,134 414,248" fill="#60a5fa"/>
  <text x="340" y="268" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e40af">Rising high into the sky</text>
  <text x="340" y="283" text-anchor="middle" font-size="10" fill="#1d4ed8">අහස උසට නැඟී යන ගොඩනැගිලි</text>

  <!-- 3. Aerial View of Winding Rivers & Clouds -->
  <rect x="456" y="50" width="202" height="246" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="557" y="74" text-anchor="middle" font-size="12.5" font-weight="800" fill="#155e75">AERIAL VIEW (ගුවන් දර්ශනය)</text>
  <rect x="472" y="92" width="170" height="152" rx="8" fill="#d9f99d"/>
  <path d="M482 102 C540 120, 500 175, 565 182 C610 188, 590 225, 632 236" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="515" cy="130" rx="22" ry="10" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="598" cy="148" rx="26" ry="11" fill="#ffffff" opacity="0.9"/>
  <text x="557" y="268" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0e7490">Expansive view from an aeroplane</text>
  <text x="557" y="283" text-anchor="middle" font-size="10" fill="#155e75">Mural proportions (දැවැන්ත පරිමාණය)</text>
</svg>
