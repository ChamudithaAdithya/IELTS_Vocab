<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="therm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="680" height="320" rx="18" fill="#f8fafc"/>
  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Urban Cooling: Tree Canopy Cover, Reflecting Road Coating &amp; Thermal Image</text>

  <!-- Left: Street cooling technologies -->
  <rect x="22" y="48" width="320" height="252" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="72" cy="88" r="20" fill="#facc15"/>
  <!-- Light rays reflecting off coated road -->
  <line x1="88" y1="104" x2="152" y2="224" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="152" y1="224" x2="202" y2="128" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="184" y="118" font-size="10.5" font-weight="700" fill="#0284c7">Reflected sunlight</text>

  <!-- Tree Canopy Cover -->
  <ellipse cx="272" cy="138" rx="52" ry="34" fill="#16a34a"/>
  <rect x="266" y="168" width="12" height="62" fill="#78350f"/>
  <text x="272" y="94" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">Canopy cover (ගස් ආවරණය)</text>

  <!-- Road with reflective coating -->
  <rect x="38" y="226" width="288" height="26" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="182" y="243" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b">Special Light-Reflecting Road Coating</text>
  <text x="182" y="280" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f766e">Brings down street temperature</text>

  <!-- Right: Thermal Image -->
  <rect x="360" y="48" width="298" height="252" rx="14" fill="#0f172a"/>
  <text x="509" y="74" text-anchor="middle" font-size="13" font-weight="800" fill="#f8fafc">THERMAL IMAGE (තාප රූපය)</text>
  <!-- Uncoated hot asphalt -->
  <rect x="382" y="102" width="116" height="122" rx="8" fill="#dc2626"/>
  <circle cx="440" cy="162" r="34" fill="#facc15" opacity="0.75"/>
  <text x="440" y="166" text-anchor="middle" font-size="13" font-weight="800" fill="#7f1d1d">48°C HOT</text>
  <text x="440" y="242" text-anchor="middle" font-size="10" fill="#fca5a5">Dark Asphalt</text>
  <!-- Coated cool street -->
  <rect x="518" y="102" width="116" height="122" rx="8" fill="#1d4ed8"/>
  <circle cx="576" cy="162" r="34" fill="#38bdf8" opacity="0.65"/>
  <text x="576" y="166" text-anchor="middle" font-size="13" font-weight="800" fill="#eff6ff">35°C COOL</text>
  <text x="576" y="242" text-anchor="middle" font-size="10" fill="#93c5fd">Coated + Canopy</text>
  <rect x="388" y="262" width="242" height="12" rx="6" fill="url(#therm)"/>
</svg>
