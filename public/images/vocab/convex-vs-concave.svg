<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Inter, system-ui, sans-serif">
  <rect width="680" height="320" rx="18" fill="#f8fafc"/>
  <text x="340" y="34" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Convex vs. Concave &amp; Geometric Shapes</text>

  <!-- Panel 1: Convex -->
  <rect x="24" y="52" width="200" height="244" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="124" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">CONVEX (උත්තල)</text>
  <text x="124" y="99" text-anchor="middle" font-size="11" fill="#475569">Curves OUTWARDS</text>
  <path d="M106 122 C152 155, 152 215, 106 248 C60 215, 60 155, 106 122 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3" transform="translate(18,0)"/>
  <line x1="60" y1="160" x2="96" y2="160" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="60" y1="210" x2="96" y2="210" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="152" y1="160" x2="192" y2="185" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="152" y1="210" x2="192" y2="185" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="192" cy="185" r="4" fill="#d97706"/>
  <text x="124" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Bulges outward like a dome</text>

  <!-- Panel 2: Concave -->
  <rect x="240" y="52" width="200" height="244" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="340" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">CONCAVE (අවතල)</text>
  <text x="340" y="99" text-anchor="middle" font-size="11" fill="#475569">Curves INWARDS ("cave")</text>
  <path d="M304 122 L376 122 C352 158, 352 212, 376 248 L304 248 C328 212, 328 158, 304 122 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <line x1="274" y1="160" x2="314" y2="160" stroke="#ec4899" stroke-width="2.5"/>
  <line x1="274" y1="210" x2="314" y2="210" stroke="#ec4899" stroke-width="2.5"/>
  <line x1="364" y1="160" x2="404" y2="136" stroke="#ec4899" stroke-width="2.5"/>
  <line x1="364" y1="210" x2="404" y2="234" stroke="#ec4899" stroke-width="2.5"/>
  <text x="340" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">Hollows inward like a bowl</text>

  <!-- Panel 3: Geometric Shapes -->
  <rect x="456" y="52" width="200" height="244" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="556" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">GEOMETRIC SHAPES</text>
  <text x="556" y="99" text-anchor="middle" font-size="11" fill="#475569">ජ්‍යාමිතික හැඩතල</text>
  <circle cx="512" cy="152" r="26" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/>
  <polygon points="596,126 624,178 568,178" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <rect x="488" y="198" width="48" height="48" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
  <polygon points="596,196 624,212 624,238 596,252 568,238 568,212" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="556" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#0f766e">Clean mathematical forms</text>
</svg>
