<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="420" rx="20" fill="#f5f3ff"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#1e1b4b">Neurological Link Between Procrastination &amp; Emotion</text>
  <text x="400" y="60" text-anchor="middle" font-size="13" fill="#4c1d95">Brain Imaging: Threat Detection vs. Emotion Regulation Regions</text>

  <rect x="36" y="82" width="728" height="310" rx="18" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>

  <!-- Stylized Side-View Human Brain Silhouette -->
  <path d="M250 265 C215 262, 195 232, 202 198 C198 162, 226 132, 268 126 C295 102, 355 96, 405 112 C458 106, 508 134, 522 178 C536 216, 516 258, 476 272 C456 298, 416 304, 392 284 L392 332 L352 332 L352 276 C312 282, 278 276, 250 265 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>

  <!-- Brain Sulci / Folds -->
  <path d="M285 152 Q335 168 375 145 M325 198 Q385 182 445 205 M405 142 Q445 165 485 158" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>

  <!-- Prefrontal Cortex (Front Left): Emotion Regulation -->
  <ellipse cx="248" cy="196" rx="40" ry="44" fill="#3b82f6" opacity="0.85"/>
  <circle cx="248" cy="196" r="48" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="5 4"/>
  <line x1="200" y1="196" x2="155" y2="196" stroke="#1d4ed8" stroke-width="2.5"/>
  <rect x="54" y="148" width="138" height="96" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="123" y="172" text-anchor="middle" font-size="12" font-weight="800" fill="#1e3a8a">PREFRONTAL</text>
  <text x="123" y="188" text-anchor="middle" font-size="12" font-weight="800" fill="#1e3a8a">CORTEX</text>
  <text x="123" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">Emotion Regulation</text>
  <text x="123" y="228" text-anchor="middle" font-size="10" fill="#475569">Calms impulses &amp; focus</text>

  <!-- Amygdala (Deep Center): Threat Detection -->
  <circle cx="372" cy="228" r="22" fill="#ef4444"/>
  <circle cx="372" cy="228" r="32" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 3"/>
  <line x1="404" y1="228" x2="548" y2="215" stroke="#dc2626" stroke-width="2.5"/>
  <rect x="548" y="156" width="194" height="112" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="645" y="180" text-anchor="middle" font-size="13" font-weight="800" fill="#991b1b">AMYGDALA (Larger)</text>
  <text x="645" y="200" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dc2626">Detection of Threats</text>
  <text x="645" y="220" text-anchor="middle" font-size="10.5" fill="#7f1d1d">Views hard tasks as threats</text>
  <text x="645" y="236" text-anchor="middle" font-size="10.5" fill="#7f1d1d">to self-worth → Anxious!</text>
  <text x="645" y="254" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">(Identifying threats)</text>

  <!-- Weak neural connection dashed line between Prefrontal Cortex & Amygdala -->
  <line x1="285" y1="205" x2="352" y2="224" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="400" y="368" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">Neurological = Related to brain regions, nerves &amp; emotional control</text>
</svg>
