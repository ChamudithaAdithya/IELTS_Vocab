<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="420" rx="20" fill="#bae6fd"/>
  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">Landlocked Country / Region vs. Coastal Waters</text>
  <text x="400" y="57" text-anchor="middle" font-size="13" fill="#0c4a6e">Landlocked = Completely Surrounded by Land (No Direct Access to the Sea)</text>

  <!-- Continent Landmass -->
  <path d="M165 88 C260 72, 540 72, 645 96 C705 145, 712 285, 635 348 C525 385, 275 382, 168 340 C105 280, 108 135, 165 88 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>

  <!-- Neighboring Coastal Countries Borders -->
  <path d="M165 88 L305 155 M645 96 L512 162 M635 348 L505 276 M168 340 L298 272" stroke="#86efac" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- Highlighted LANDLOCKED Interior Country -->
  <polygon points="305,155 512,162 532,225 505,276 298,272 276,216" fill="#fef3c7" stroke="#d97706" stroke-width="3.5"/>
  <text x="405" y="206" text-anchor="middle" font-size="18" font-weight="900" fill="#92400e">LANDLOCKED</text>
  <text x="405" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">100% Surrounded by Land</text>
  <text x="405" y="244" text-anchor="middle" font-size="11" fill="#78350f">(e.g., Nepal, Mali, Niger)</text>

  <!-- Inland River flowing from Ocean into Landlocked Region -->
  <path d="M118 225 Q210 210 276 216 Q345 224 395 256" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
  <text x="212" y="202" text-anchor="middle" font-size="11" font-weight="800" fill="#0369a1">Inland River →</text>

  <!-- Coastal Waters Labels -->
  <rect x="26" y="138" width="118" height="44" rx="10" fill="#0284c7"/>
  <text x="85" y="157" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">OPEN SEA</text>
  <text x="85" y="173" text-anchor="middle" font-size="10.5" fill="#e0f2fe">Coastal Waters</text>

  <rect x="658" y="185" width="118" height="44" rx="10" fill="#0284c7"/>
  <text x="717" y="204" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">OCEAN</text>
  <text x="717" y="220" text-anchor="middle" font-size="10.5" fill="#e0f2fe">Direct Sea Access</text>

  <text x="410" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Coastal Neighbouring Countries</text>
  <text x="410" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">African manatees swim up rivers into landlocked countries!</text>
</svg>
